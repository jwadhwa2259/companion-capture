[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "companion-capture"
version = "2.0.0"
description = "Capture AI companion speech bubble messages from Claude Code terminal sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Jay Wadhwa" }]
keywords = ["claude", "companion", "terminal", "capture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",

    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.scripts]
companion-capture = "companion_capture.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
